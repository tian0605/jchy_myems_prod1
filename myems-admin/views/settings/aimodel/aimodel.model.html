<div class="inmodal">
    <div class="modal-header"><h4 class="modal-title">{{model.id ? '修改 AI 模型' : '添加 AI 模型'}}</h4></div>
    <div class="modal-body">
        <form name="form_ai_model" novalidate class="form-horizontal">
            <div class="form-group"><label class="col-sm-4 control-label">名称 *</label><div class="col-sm-8"><input ng-model="model.name" class="form-control" required></div></div>
            <div class="form-group"><label class="col-sm-4 control-label">服务商 *</label><div class="col-sm-8"><select ng-model="model.provider" class="form-control" required><option value="openai_compatible">OpenAI 兼容接口</option><option value="ark_responses">火山方舟 Responses API</option></select></div></div>
            <div class="form-group"><label class="col-sm-4 control-label">接口地址 *</label><div class="col-sm-8"><input ng-model="model.base_url" type="url" class="form-control" required><span class="help-block" ng-if="model.provider === 'ark_responses'">填写 API 根地址，例如 https://ark.cn-beijing.volces.com/api/v3</span></div></div>
            <div class="form-group"><label class="col-sm-4 control-label">模型名称 *</label><div class="col-sm-8"><input ng-model="model.model_name" class="form-control" required></div></div>
            <div class="form-group"><label class="col-sm-4 control-label">API 密钥 *</label><div class="col-sm-8"><input name="apiKey" ng-model="model.api_key" type="password" autocomplete="new-password" ng-required="!model.id" class="form-control"><span class="help-block">密钥仅在保存时提交，服务端会加密保存，之后不会再次显示。</span><span class="help-block text-success" ng-if="model.is_api_key_encrypted">当前已加密保存密钥；留空可保留现有密钥。</span></div></div>
            <div class="form-group"><label class="col-sm-4 control-label">备用密钥环境变量</label><div class="col-sm-8"><input name="apiKeyEnvName" ng-model="model.api_key_env_name" ng-pattern="/^[A-Z][A-Z0-9_]*$/" placeholder="ARK_API_KEY" class="form-control"><span class="help-block">可选。未通过网页保存密钥时，系统会读取此环境变量。</span><span class="help-block text-danger" ng-if="form_ai_model.apiKeyEnvName.$error.pattern">环境变量名必须以大写字母开头，且只能包含大写字母、数字和下划线。</span></div></div>
            <div class="form-group"><label class="col-sm-4 control-label">超时（秒）*</label><div class="col-sm-8"><input ng-model="model.timeout_seconds" type="number" min="1" max="600" class="form-control" required></div></div>
            <div class="form-group"><label class="col-sm-4 control-label">启用</label><div class="col-sm-8"><input ng-model="model.is_enabled" type="checkbox"></div></div>
            <div class="form-group"><label class="col-sm-4 control-label">设为默认模型</label><div class="col-sm-8"><input ng-model="model.is_default" type="checkbox"></div></div>
        </form>
    </div>
    <div class="modal-footer"><button class="btn btn-white" ng-click="cancel()">取消</button><button class="btn btn-primary" ng-disabled="form_ai_model.$invalid" ng-click="ok()">保存</button></div>
</div>
